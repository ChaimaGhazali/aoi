# Measurement card + engine config for one cognitive dimension.
# Everything the app knows about a dimension lives in this file: adding a new
# dimension = adding a new YAML file (validated by `npm run dims:check`).
id: working_memory
name: Working memory
version: 1
color: "#2a78d6"

card:
  definition: >
    The ability to hold a small amount of information in mind for a few seconds while updating it with new input. Measured here as how well you can track whether the current item matches the one shown N steps earlier.
  what_it_is_not: >
    Not long-term memory, not intelligence, and not a diagnostic measure. Scores describe performance on this task today, on this device.
  citations:
    - "Kirchner, W. K. (1958). Age differences in short-term retention of rapidly changing information. J. Exp. Psychol., 55(4), 352-358."
    - "Owen, A. M. et al. (2005). N-back working memory paradigm: a meta-analysis of normative functional neuroimaging studies. Hum. Brain Mapp., 25(1), 46-59."
  biases:
    - "Practice effects: scores rise with familiarity with the task itself, not only with working-memory growth."
    - "Fatigue and time of day lower performance; the session time is logged so the coach can mention it."
    - "Input latency differs between touch screens and keyboards; RT carries only a small weight for this reason."
    - "Strategy (e.g. verbal rehearsal of letters) helps more at 1-back than at 3-back."

tasks:
  - id: n_back
    name: N-back (letters)
    paradigm: n_back
    instructions: >
      Letters appear one at a time. Press SPACE when the letter is the same as the one shown N letters ago. Do nothing otherwise.
    params:
      stimulus_set: [B, C, D, F, G, H, K, L]
      trials_per_block: 24
      target_rate: 0.3
      stimulus_ms: 500
      isi_ms: 2000
    difficulty:
      target_success: 0.75
      levels:
        - {level: 1, params: {n: 1}, ability_range: [-0.664, 1.013]}
        - {level: 2, params: {n: 2}, ability_range: [-0.187, 1.024]}
        - {level: 3, params: {n: 3}, ability_range: [-0.089, 1.255]}
    scoring:
      # composite (0..1) = sum(weight * normalised metric); then mapped into the
      # level's ability_range to give one observation for the profiler.
      components:
        # d′ only: speed is processing speed's job, and weighting it here penalised slower responders (validation E6).
        - {metric: d_prime, weight: 1.0, normalise: {method: linear, min: 0.0, max: 3.5}}
    validity:
      min_rt_ms: 150
      max_rt_ms: 2500
      min_valid_trials: 16
      chance_accuracy: 0.5
      chance_margin_z: 1.0
      max_same_response_streak: 18

profile:
  prior: {mean: 0.5, sd: 0.2}
  uncertainty:
    model: normal
    obs_sd: 0.192
    reference_trials: 24
    invalid_block_sd_multiplier: 2.5
    drift_sd_per_day: 0.01
  calibration:
    intercept: 0
    slope: 1
    source: level ranges and obs_sd fitted on 250 simulated users, 2026-10-27; refit on pilot data
