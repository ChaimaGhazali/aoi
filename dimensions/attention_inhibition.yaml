id: attention_inhibition
name: Attention & inhibition
version: 1
color: "#eb6834"

card:
  definition: >
    The ability to stay focused on what matters and hold back an automatic response. Measured as how much slower and less accurate you get when the word meaning conflicts with the ink colour you must name.
  what_it_is_not: >
    Not a measure of attention-related conditions and not a diagnosis. It describes interference on this specific task.
  citations:
    - "Stroop, J. R. (1935). Studies of interference in serial verbal reactions. J. Exp. Psychol., 18(6), 643-662."
    - "MacLeod, C. M. (1991). Half a century of research on the Stroop effect: an integrative review. Psychol. Bull., 109(2), 163-203."
  biases:
    - "Reading fluency: the effect depends on fluent reading of the colour words; non-native English readers may show less interference. A language setting is planned."
    - "Colour vision: users with colour-vision differences are offered a high-contrast palette; colours are never the only cue in the UI."
    - "Response mapping: the first block includes extra practice so key-learning is not scored as inhibition."
    - "Fatigue and motivation lower accuracy late in a session."

tasks:
  - id: stroop
    name: Colour-word Stroop
    paradigm: stroop
    instructions: >
      A colour word appears in coloured ink. Press the key for the INK colour, not the word. Be fast but accurate.
    params:
      colours: [red, green, blue, yellow]
      keys: {red: d, green: f, blue: j, yellow: k}
      trials_per_block: 32
      practice_trials: 8
      max_response_ms: 2500
    difficulty:
      target_success: 0.75
      levels:
        - {level: 1, params: {incongruent_rate: 0.25, deadline_ms: 2500}, ability_range: [-0.58, 1.427]}
        - {level: 2, params: {incongruent_rate: 0.5, deadline_ms: 1800}, ability_range: [-0.513, 1.363]}
        - {level: 3, params: {incongruent_rate: 0.75, deadline_ms: 1200}, ability_range: [-0.442, 1.314]}
    scoring:
      components:
        # Proportional interference (cost ÷ congruent RT), not raw ms or overall speed: fair to slower, equally
        # accurate responders (validation E6). Faust et al. 1999 on proportional measures and general slowing.
        - {metric: interference_ratio, weight: 0.55, normalise: {method: linear, min: 0.05, max: 0.3, invert: true}}
        - {metric: incongruent_accuracy, weight: 0.45, normalise: {method: linear, min: 0.5, max: 1.0}}
    validity:
      min_rt_ms: 200
      max_rt_ms: 2500
      min_valid_trials: 24
      chance_accuracy: 0.25
      max_same_response_streak: 10

profile:
  prior: {mean: 0.5, sd: 0.2}
  uncertainty:
    model: normal
    obs_sd: 0.287
    reference_trials: 32
    invalid_block_sd_multiplier: 2.5
    drift_sd_per_day: 0.01
  calibration:
    intercept: 0
    slope: 1
    source: level ranges and obs_sd fitted on 250 simulated users, 2026-10-26; refit on pilot data
